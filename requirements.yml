functional:
  - Пользователь может просматривать каталог товаров
  - Пользователь может открыть страницу товара и увидеть название, рейтинг, цену со скидкой и без скидки
  - Пользователь может искать товары по ключевому слову
  - Пользователь может фильтровать товары по категории и другим доступным параметрам
  - Пользователь может переходить между страницами каталога с помощью пагинации
  - Пользователь может добавить товар в корзину из каталога или со страницы товара
  - Пользователь может просмотреть содержимое корзины
  - Пользователь может удалить товар из корзины
  - Пользователь может продолжить выбор товаров после добавления товара в корзину
  - Пользователь может оформить заказ и перейти на страницу оплаты
  - Корзина сохраняется в сессии браузера
  - Пользователь может переключить язык интерфейса между русским и английским

non-functional:
  - Сайт должен быть удобным в использовании
  - Сайт должен быстро загружаться и отзывчиво реагировать на действия пользователя
  - Сайт должен быть безопасным и защищать данные пользователя
  - Сайт должен иметь адаптивную мобильную версию
  - Сайт должен корректно работать в последних версиях популярных браузеров
  - Сайт должен быть доступен с различных устройств
  - Сайт должен выдерживать большое количество одновременных пользователей
  - Сайт должен быть доступен из сети Интернет без использования VPN

implicit:
  - При отсутствии результатов поиска или фильтрации пользователь должен видеть понятное сообщение, а не пустую страницу без объяснений
  - Цена со скидкой должна быть меньше или равна обычной цене, а скидка должна быть визуально различима
  - Рейтинг товара должен отображаться корректно и не должен быть отрицательным
  - Нельзя добавить в корзину недоступный или несуществующий товар
  - После удаления товара корзина должна сразу обновляться без перезагрузки страницы
  - При переключении языка интерфейса выбранные фильтры, страница каталога и содержимое корзины не должны теряться
