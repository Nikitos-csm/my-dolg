bugreports: 
summary: |
    Изображения товаров не помещаются в свою рамку
  environment: |
    URL: https://products-store.hexlet.app/
    Google Chrome последняя стабильная версия, 64-bit
    ОС: Windows 11 / macOS / Linux — укажите вашу фактическую ОС
    Устройство: desktop
  steps-to-reproduce: |
    1. Открыть главную страницу каталога https://products-store.hexlet.app/
    2. Просмотреть карточки товаров в каталоге
    3. Открыть страницу любого товара
    4. Сравнить размеры изображения товара и границы его рамки
  expected-result: |
    Изображение товара полностью помещается в отведенную для него рамку
    Изображение не выходит за границы карточки или блока с товаром
    Пропорции изображения сохраняются, neighboring элементы интерфейса не перекрываются
  actual-result: |
    Изображения товаров выходят за границы своей рамки
    Часть изображения обрезается или перекрывает другие элементы карточки товара
    Верстка карточки выглядит некорректно

- summary: |
    Некорректно работает фильтрация товаров по категориям
  environment: |
    URL: https://products-store.hexlet.app/
    Google Chrome последняя стабильная версия, 64-bit
    ОС: Windows 11 / macOS / Linux — укажите вашу фактическую ОС
    Устройство: desktop
  steps-to-reproduce: |
    1. Открыть главную страницу каталога https://products-store.hexlet.app/
    2. Выбрать любую категорию товаров в фильтре
    3. Просмотреть список отображенных товаров
    4. Переключить категорию на другую
    5. Снова просмотреть список отображенных товаров
  expected-result: |
    После выбора категории в каталоге отображаются только товары, относящиеся к выбранной категории
    При смене категории список товаров корректно обновляется
    Выбранная категория визуально выделяется как активная
  actual-result: |
    Фильтрация по категориям работает некорректно
    В списке отображаются товары, не относящиеся к выбранной категории, либо список не обновляется после смены категории
    Результаты фильтрации не соответствуют выбранной категории

- summary: |
    Не отображается флажок при смене языка интерфейса
  environment: |
    URL: https://products-store.hexlet.app/
    Google Chrome последняя стабильная версия, 64-bit
    ОС: Windows 11 / macOS / Linux — укажите вашу фактическую ОС
    Устройство: desktop
  steps-to-reproduce: |
    1. Открыть главную страницу интернет-магазина https://products-store.hexlet.app/
    2. Найти переключатель языка в шапке сайта
    3. Нажать на переключатель языка
    4. Выбрать другой язык интерфейса
  expected-result: |
    После выбора языка интерфейс переключается на выбранный язык
    Рядом с переключателем или в выпадающем списке отображается флажок выбранного языка
  actual-result: |
    Язык интерфейса меняется, но флажок выбранного языка не отображается
    Пользователь не может визуально определить текущий выбранный язык по флажку

- summary: |
    Выбранный язык автоматически меняется при обновлении страницы сайта
  environment: |
    URL: https://products-store.hexlet.app/
    Google Chrome последняя стабильная версия, 64-bit
    ОС: Windows 11 / macOS / Linux — укажите вашу фактическую ОС
    Устройство: desktop
  steps-to-reproduce: |
    1. Открыть главную страницу интернет-магазина https://products-store.hexlet.app/
    2. Переключить язык интерфейса, например с русского на английский
    3. Убедиться, что интерфейс отображается на выбранном языке
    4. Обновить страницу с помощью клавиши F5 или кнопки обновления в браузере
  expected-result: |
    После обновления страницы выбранный пользователем язык сохраняется
    Интерфейс продолжает отображаться на выбранном языке
  actual-result: |
    После обновления страницы язык интерфейса автоматически меняется на язык по умолчанию
    Выбор пользователя не сохраняется

- summary: |
    На сайте отсутствует возможность авторизации пользователя
  environment: |
    URL: https://products-store.hexlet.app/
    Google Chrome последняя стабильная версия, 64-bit
    ОС: Windows 11 / macOS / Linux — укажите вашу фактическую ОС
    Устройство: desktop
  steps-to-reproduce: |
    1. Открыть главную страницу интернет-магазина https://products-store.hexlet.app/
    2. Осмотреть шапку сайта, меню и подвал
    3. Попробовать найти ссылку или кнопку «Войти», «Регистрация» или «Личный кабинет»
    4. Перейти по адресу https://products-store.hexlet.app/login
  expected-result: |
    На сайте должна быть доступна авторизация пользователя
    Пользователь должен иметь возможность войти в учетную запись через кнопку «Войти» или соответствующую страницу
  actual-result: |
    На сайте нет кнопки, ссылки или страницы авторизации
    Пользователь не может войти в учетную запись
    При переходе на https://products-store.hexlet.app/login страница авторизации не открывается

- summary: |
    При оформлении заказа не отображается идентификация пользователя
  environment: |
    URL: https://products-store.hexlet.app/
    Google Chrome последняя стабильная версия, 64-bit
    ОС: Windows 11 / macOS / Linux — укажите вашу фактическую ОС
    Устройство: desktop
  steps-to-reproduce: |
    1. Открыть главную страницу интернет-магазина https://products-store.hexlet.app/
    2. Выбрать любой товар в каталоге
    3. Нажать кнопку «Добавить в корзину»
    4. Открыть корзину
    5. Нажать кнопку оформления заказа
    6. Перейти на страницу оплаты
  expected-result: |
    На странице оформления заказа или оплаты отображаются данные пользователя, необходимые для идентификации покупателя:
    имя, электронная почта или другие контактные данные
    Либо пользователю предлагается войти в учетную запись или указать данные для доставки и связи
  actual-result: |
    После добавления товара в корзину и оформления заказа страница оплаты открывается без идентификации пользователя
    Не отображаются имя, электронная почта или форма для ввода контактных данных покупателя
    Невозможно определить, от имени какого пользователя оформляется заказ

- summary: |
    Сайт некорректно отображается на мобильных устройствах
  environment: |
    URL: https://products-store.hexlet.app/
    Google Chrome последняя стабильная версия, 64-bit
    Режим мобильного устройства в DevTools
    Разрешение: 375 × 667
    Устройство: мобильный телефон / эмуляция мобильного устройства
  steps-to-reproduce: |
    1. Открыть главную страницу интернет-магазина https://products-store.hexlet.app/
    2. Включить режим мобильного устройства в DevTools
    3. Установить разрешение 375 × 667
    4. Просмотреть главную страницу, каталог, страницу товара и корзину
    5. Попробовать воспользоваться фильтрами, поиском и кнопками добавления товара в корзину
  expected-result: |
    Интерфейс адаптируется под ширину экрана мобильного устройства
    Все элементы управления остаются доступными и удобными для нажатия
    Нет горизонтальной прокрутки
    Текст, изображения, кнопки и карточки товаров отображаются корректно
  actual-result: |
    Сайт плохо адаптирован для мобильного использования
    Элементы интерфейса отображаются некорректно или выходят за границы экрана
    Возникает горизонтальная прокрутка
    Часть кнопок, фильтров или карточек товаров неудобно нажимать или они перекрывают друг друга
