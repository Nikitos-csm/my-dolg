---
- summary: |
    Успешное открытие главной страницы каталога
  requirement: |
    Пользователь должен иметь возможность просматривать каталог товаров
  prerequisites: |
    Открыт браузер с доступом в Интернет
  test-data: |
    URL = https://products-store.hexlet.app/
  steps:
    - Открыть главную страницу сайта
  expected-result: |
    Загружается каталог товаров без ошибок
    Отображаются карточки товаров с названием, рейтингом и ценами

- summary: |
    Успешный поиск товара по существующему ключевому слову
  requirement: |
    Пользователь должен иметь возможность искать товары по ключевому слову
  prerequisites: |
    Открыта главная страница каталога
  test-data: |
    Ключевое слово = cream
  steps:
    - Ввести в поле поиска «cream»
    - Нажать кнопку поиска или клавишу Enter
  expected-result: |
    В каталоге отображаются только товары, название или описание которых содержит «cream»
    Страница не перезагружается

- summary: |
    Поиск по несуществующему ключевому слову
  requirement: |
    При отсутствии результатов поиска пользователь должен увидеть понятное сообщение
  prerequisites: |
    Открыта главная страница каталога
  test-data: |
    Ключевое слово = qqqzzz999 
  steps:
    - Ввести в поле поиска «qqqzzz999»
    - Нажать кнопку поиска или клавишу Enter
  expected-result: |
    Товары не отображаются
    Видно сообщение об отсутствии результатов поиска

- summary: |
    Успешная фильтрация товаров по категории
  requirement: |
    Пользователь должен иметь возможность фильтровать товары
  prerequisites: |
    Открыта главная страница каталога
  test-data: |
    Категория = любая доступная категория из фильтра
  steps:
    - Выбрать категорию в фильтре
  expected-result: |
    В каталоге отображаются только товары выбранной категории
    Значение фильтра сохраняется

- summary: |
    Успешный переход на следующую страницу каталога
  requirement: |
    Пользователь должен иметь возможность пользоваться постраничным выводом товаров
  prerequisites: |
    Открыта главная страница каталога
    В каталоге больше товаров, чем помещается на одной странице
  test-data: |
    Номер страницы = 2
  steps:
    - Нажать кнопку перехода на следующую страницу
  expected-result: |
    Открывается вторая страница каталога
    Отображается другой набор товаров
    Страница не перезагружается

- summary: |
    Успешное открытие страницы товара из каталога
  requirement: |
    Пользователь должен иметь возможность просматривать подробную информацию о товаре
  prerequisites: |
    Открыта главная страница каталога
    В каталоге есть хотя бы один товар
  test-data: |
    Любой доступный товар из каталога
  steps:
    - Нажать на карточку товара
  expected-result: |
    Открывается страница выбранного товара
    Отображаются название, рейтинг, цена со скидкой и цена без скидки

- summary: |
    Успешное добавление товара в корзину из каталога
  requirement: |
    Пользователь должен иметь возможность добавлять товары в корзину
  prerequisites: |
    Открыта главная страница каталога
    В каталоге есть хотя бы один товар
  test-data: |
    Любой доступный товар из каталога
  steps:
    - Найти карточку товара
    - Нажать кнопку «Добавить в корзину»
  expected-result: |
    Товар добавляется в корзину
    Счетчик корзины увеличивается на один товар
    Пользователь остается в каталоге

- summary: |
    Успешное добавление товара в корзину со страницы товара
  requirement: |
    Пользователь должен иметь возможность добавить товар в корзину со страницы товара
  prerequisites: |
    Открыта страница любого доступного товара
  test-data: |
    Любой доступный товар из каталога
  steps:
    - Нажать кнопку «Добавить в корзину»
  expected-result: |
    Товар добавляется в корзину
    Счетчик корзины увеличивается на один товар
    Пользователь остается на странице товара

- summary: |
    Успешный просмотр содержимого корзины
  requirement: |
    Пользователь должен иметь возможность просматривать содержимое корзины
  prerequisites: |
    В корзину добавлен хотя бы один товар
  test-data: |
    Любой добавленный в корзину товар
  steps:
    - Открыть корзину
  expected-result: |
    Открывается страница корзины
    Отображается добавленный товар, его количество и стоимость
    Отображается итоговая сумма заказа

- summary: |
    Успешное удаление товара из корзины
  requirement: |
    Пользователь должен иметь возможность удалить товар из корзины
  prerequisites: |
    Открыта страница корзины
    В корзине есть хотя бы один товар
  test-data: |
    Любой товар в корзине
  steps:
    - Нажать кнопку удаления товара
  expected-result: |
    Товар исчезает из корзины
    Итоговая сумма пересчитывается
    Страница не перезагружается

- summary: |
    Сохранение корзины после перехода в каталог
  requirement: |
    Корзина должна храниться в сессии браузера
  prerequisites: |
    В корзину добавлен хотя бы один товар
  test-data: |
    Любой добавленный в корзину товар
  steps:
    - Перейти в каталог
    - Открыть корзину
  expected-result: |
    Добавленный ранее товар остается в корзине
    Количество и итоговая сумма не изменяются

- summary: |
    Успешное оформление заказа с переходом на страницу оплаты
  requirement: |
    Пользователь должен иметь возможность оформить заказ и перейти на страницу оплаты
  prerequisites: |
    Открыта страница корзины
    В корзине есть хотя бы один товар
  test-data: |
    Любой товар в корзине
  steps:
    - Нажать кнопку оформления заказа
  expected-result: |
    Происходит переход на страницу оплаты
    Страница оплаты открывается без ошибок

- summary: |
    Успешное переключение языка интерфейса на английский
  requirement: |
    Пользователь должен иметь возможность переключить язык интерфейса
  prerequisites: |
    Открыт сайт с русским интерфейсом
  test-data: |
    Целевой язык = English
  steps:
    - Открыть переключатель языка
    - Выбрать английский язык
  expected-result: |
    Элементы интерфейса отображаются на английском языке
    Страница не перезагружается полностью

- summary: |
    Корректное отображение сайта на мобильном разрешении
  requirement: |
    Сайт должен иметь адаптивную мобильную версию
  prerequisites: |
    Открыт сайт в браузере
    Открыты инструменты разработчика
  test-data: |
    Разрешение = 375 × 667
  steps:
    - Включить режим мобильного устройства в DevTools
    - Выбрать разрешение 375 × 667
    - Обновить страницу
  expected-result: |
    Интерфейс адаптируется под ширину экрана
    Нет горизонтальной прокрутки
    Кнопки, фильтры и карточки товаров остаются доступными

- summary: |
    Корректная работа SPA-навигации без перезагрузки страницы
  requirement: |
    Сайт должен быть SPA-приложением и не перезагружать страницу при навигации
  prerequisites: |
    Открыта главная страница каталога
    Открыты инструменты разработчика
  test-data: |
    Любой доступный товар
  steps:
    - Перейти на страницу товара
    - Вернуться в каталог
    - Открыть корзину
  expected-result: |
    Переходы между разделами происходят без полной перезагрузки страницы
    Содержимое страницы обновляется корректно
